# Runs against the released version: onboards and creates repositories whose secret depends on the
# master key.
appId: org.equalitie.ouisync
env:
  PASSWORD: upgrade-test-password
---
- launchApp:
    clearState: true
- runFlow: allow_notifications.yaml

# Onboarding
- tapOn: "(?s)English(\\n.*)?"
# Swiping doesn't work: it can't leave the last page.
- repeat:
    times: 3
    commands:
      - tapOn: "Next"
- tapOn: "(?i)i agree"

# Random secret stored on device (the default). Needs the master key to open.
- runFlow:
    file: create_repo.yaml
    env:
      NAME: Upgrade default
- back

# Local password, remembered. Also needs the master key to open.
- runFlow:
    file: create_repo.yaml
    env:
      NAME: Upgrade remembered
- runFlow:
    file: set_password.yaml
    env:
      FORGET: "false"
- back

- assertVisible: "(?s)Upgrade default(\\n.*)?"
- assertVisible: "(?s)Upgrade remembered(\\n.*)?"

# Give the app a moment to persist settings before it's replaced.
- waitForAnimationToEnd
- stopApp
