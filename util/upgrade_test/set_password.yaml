# Switches the currently open repository to a local password. "Remember password" stays on unless
# ${FORGET} is "true". Called from `seed.yaml` and ends on the repository page.
#
# Flutter merges a tile's title and subtitle into one accessibility label ("Title\nSubtitle") and
# Maestro matches the whole label, hence the `(?s)Title(\n.*)?` selectors here and in the other
# flows.
appId: org.equalitie.ouisync
---
# The repo settings button got an accessibility label after v0.9.4. Releases without it are tapped
# by position (the middle of the button in the app bar, below the status bar). The fallback must come first: once the settings sheet is open, the label is hidden
# behind it, so a `notVisible` check placed after the label tap would also fire.
- runFlow:
    when:
      notVisible: "Repository settings"
    commands:
      - tapOn:
          point: "95%,9%"
- runFlow:
    when:
      visible: "Repository settings"
    commands:
      - tapOn: "Repository settings"
- tapOn: "(?s)Security(\\n.*)?"
- tapOn: "(?s)Use local password(\\n.*)?"
- tapOn:
    text: "Password:? ?"
    index: 0
- inputText: ${PASSWORD}
- tapOn: "Retype password:? ?"
- inputText: ${PASSWORD}
- runFlow:
    when:
      true: ${FORGET == 'true'}
    commands:
      - tapOn: "(?s)Remember password(\\n.*)?"
- tapOn: "(?i)update"
- tapOn: "(?i)accept"
# Leave the security page if it didn't close by itself.
- runFlow:
    when:
      visible: "(?s)Use local password(\\n.*)?"
    commands:
      - back
